<h2 mat-dialog-title>{{ title() }}</h2>
<mat-dialog-content>
  <span> <i>Active Until:</i> </span>
  <form [formGroup]="licenseForm" class="license-form">
    <div class="field">
      <label class="field-label">License</label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <input matInput type="text" formControlName="license" />
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" [disabled]="loading()" (click)="cancel()">
    Cancel
  </button>
  <button mat-flat-button color="primary" type="button" [disabled]="loading()" (click)="submit()">
    @if (loading()) {
      <mat-spinner diameter="18"></mat-spinner>
    } @else {
      {{ btnTitle() }}
    }
  </button>
</mat-dialog-actions>
