<pos-frontend-login-form
  title="Octopus Login"
  [loading]="loading()"
  [isClient]="true"
  [station]="station()"
  (formValue)="login($event)"
  (setStation)="configureStation()"
/>

@if (expired()) {
  <p class="license-warning license-expired text-center">LICENSE EXPIRED.PLEASE RENEW</p>
} @else {
  <p class="license-warning text-center">Your license will expire on {{ expiryDate() }} Please renew.</p>
}
