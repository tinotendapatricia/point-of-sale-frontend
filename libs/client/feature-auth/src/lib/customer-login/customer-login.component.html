<pos-frontend-login-form
  title="Till Login"
  [loading]="loading()"
  [isClient]="true"
  [station]="station()"
  (formValue)="login($event)"
  (setStation)="configureStation()"
/>

@if (expired()) {
  <p class="license-banner expired">License expired. Please renew.</p>
} @else if (expiringSoon()) {
  <p class="license-banner">
    Your license expires on {{ expiryDate() }} ({{ daysRemaining() }} day(s) left). Please renew.
  </p>
}
