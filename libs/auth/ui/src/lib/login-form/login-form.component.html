<div class="login">
  <div class="card-header text-center">
    <img src="assets/logo.png" alt="" />
  </div>
  <div class="login-head">{{ title() }}</div>

  <form [formGroup]="form">
    <div class="field">
      <label class="field-label" for="login-username">Username<span class="required-marker">*</span></label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <input matInput id="login-username" type="email" formControlName="username" required />
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label" for="login-password">Password<span class="required-marker">*</span></label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <input matInput id="login-password" type="password" formControlName="password" required />
      </mat-form-field>
    </div>

    <button
      mat-flat-button
      color="primary"
      class="full-width"
      type="button"
      [disabled]="!form.valid || loading()"
      (click)="submit()"
    >
      @if (loading()) {
        <mat-spinner diameter="18"></mat-spinner>
      } @else {
        Login
      }
    </button>

    <div class="text-center helper">
      <span>Forgot Password? Please contact admin</span>
    </div>

    @if (isClient()) {
      <div class="text-center links">
        <a (click)="license.emit()">Licensed until:</a> |
        <a (click)="setStation.emit()">Station = {{ station() }}</a>
      </div>
    }
  </form>
</div>
