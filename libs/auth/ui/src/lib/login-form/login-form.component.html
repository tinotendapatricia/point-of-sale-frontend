<div class="login">
  <div class="card-header text-center">
    <img ngSrc="assets/logo.png" alt="" width="457" height="130" priority />
  </div>
  <div class="login-head">{{ title() }}</div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label class="field-label" for="login-username">Username<span class="required-marker">*</span></label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <input id="login-username" matInput type="email" formControlName="username" />
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label" for="login-password">Password<span class="required-marker">*</span></label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <input id="login-password" matInput type="password" formControlName="password" />
      </mat-form-field>
    </div>

    <button type="submit" class="full-width" mat-flat-button color="primary" [disabled]="form.invalid || loading()">
      @if (loading()) {
        <mat-spinner diameter="18" />
      } @else {
        Login
      }
    </button>

    <div class="text-center helper">
      <span>Forgot Password? Please contact admin</span>
    </div>

    @if (isClient()) {
      <div class="text-center links">
        <button type="button" class="link-button" (click)="license.emit()">Licensed until:</button> |
        <button type="button" class="link-button" (click)="setStation.emit()">Station = {{ station() }}</button>
      </div>
    }
  </form>
</div>
