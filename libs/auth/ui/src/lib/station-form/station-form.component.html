<h2 mat-dialog-title>{{ title() }}</h2>
<mat-dialog-content>
  <form [formGroup]="stationForm" class="station-form">
    <div class="field">
      <label class="field-label" for="station-number">Station Number<span class="required-marker">*</span></label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <input matInput id="station-number" type="number" formControlName="stationNumber" required />
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" [disabled]="loading()" (click)="cancel()">
    Close
  </button>
  <button mat-flat-button color="primary" type="button" [disabled]="loading()" (click)="submit()">
    @if (loading()) {
      <mat-spinner diameter="18"></mat-spinner>
    } @else {
      {{ btnTitle() }}
    }
  </button>
</mat-dialog-actions>
