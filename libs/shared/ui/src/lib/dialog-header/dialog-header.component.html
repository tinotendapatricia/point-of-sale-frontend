<header class="flex items-start gap-3 border-b border-hairline px-5 py-4 bg-title">
    <div class="min-w-0 flex-1">
        <h2 mat-dialog-title class="dialog-title truncate text-base font-semibold text-ink">
            {{ title() }}
        </h2>
        @if (subtitle()) {
            <p class="mt-0.5 truncate text-sm text-ink-muted">
                {{ subtitle() }}
            </p>
        }
    </div>
    @if (!hideClose()) {
        <button mat-icon-button mat-dialog-close type="button" [aria-label]="`Close ${title()}`">
            <mat-icon>close</mat-icon>
        </button>
    }
</header>
