<div class="mx-6 mt-4 mb-6">
  <header class="mb-4">
    <h1 class="reports-title">{{ title() }}</h1>
    <p class="text-sm text-gray-500">{{ subtitle() }}</p>
  </header>

  <div class="flex flex-col gap-4 md:flex-row md:items-start">
    <aside class="shrink-0 rounded-lg border border-gray-200 bg-white p-3 shadow-sm md:w-64">
      <p class="eyebrow">{{ navLabel() }}</p>
      <pos-frontend-report-nav [items]="items()" [label]="title()" />
    </aside>

    <section class="min-w-0 flex-1 rounded-lg border border-gray-200 bg-white px-6 py-5 shadow-sm">
      @if (active(); as report) {
        <header class="mb-4">
          <h2 class="report-title">{{ report.label }}</h2>
          <p class="text-xs text-gray-500">{{ report.description }}</p>
        </header>
      }
      <ng-content />
    </section>
  </div>
</div>
