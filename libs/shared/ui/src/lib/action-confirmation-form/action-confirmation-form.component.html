<h2 mat-dialog-title class="title">{{ title() }}</h2>
<mat-dialog-content>
  <p>{{ message() }}</p>
</mat-dialog-content>
<mat-dialog-actions class="modal-footer">
  <button mat-stroked-button color="warn" type="button" [disabled]="loading()" (click)="cancel()">
    No
  </button>
  <button mat-flat-button color="primary" type="button" [disabled]="loading()" (click)="proceed.emit()">
    @if (loading()) {
      <mat-spinner diameter="18"></mat-spinner>
    } @else {
      Yes
    }
  </button>
</mat-dialog-actions>
