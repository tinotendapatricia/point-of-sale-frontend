<pos-frontend-dialog-header [title]="title()" [hideClose]="loading()" />
<mat-dialog-content>
  <p class="message">{{ message() }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" [disabled]="loading()" (click)="cancel()">
    No
  </button>
  <button mat-flat-button type="button" [disabled]="loading()" (click)="proceed.emit()">
    @if (loading()) {
      <mat-spinner diameter="18" />
    } @else {
      Yes
    }
  </button>
</mat-dialog-actions>
