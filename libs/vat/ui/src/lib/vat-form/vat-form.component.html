<form class="vat-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="field">
    <label class="field-label" for="vat-percentage">VAT Percentage<span class="required-marker">*</span></label>
    <mat-form-field class="full-width" subscriptSizing="dynamic">
      <input id="vat-percentage" matInput type="number" min="0" max="100" formControlName="vat" />
      @if (form.controls.vat.hasError('required')) {
        <mat-error>VAT percentage is required</mat-error>
      } @else if (form.controls.vat.invalid) {
        <mat-error>VAT percentage must be between 0 and 100</mat-error>
      }
    </mat-form-field>
  </div>

  <div class="mt-4 flex justify-end gap-2">
    <button type="button" mat-stroked-button [disabled]="loading()" (click)="cancelled.emit()">Cancel</button>
    <button type="submit" mat-flat-button [disabled]="loading()">
      @if (loading()) {
        <mat-spinner diameter="18" />
      } @else {
        {{ submitLabel() }}
      }
    </button>
  </div>
</form>
