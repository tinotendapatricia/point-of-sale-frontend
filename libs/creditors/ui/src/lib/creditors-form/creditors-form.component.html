<h2 mat-dialog-title>{{ title() }}</h2>
<mat-dialog-content>
  <form [formGroup]="creditorForm" class="creditor-form">
    <div class="field">
      <label class="field-label" for="creditor-account">Account<span class="required-marker">*</span></label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <input matInput id="creditor-account" type="text" formControlName="account" required />
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label" for="creditor-name">Name<span class="required-marker">*</span></label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <input matInput id="creditor-name" type="text" formControlName="name" required />
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label" for="creditor-address">Address</label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <textarea matInput id="creditor-address" formControlName="address" rows="4"></textarea>
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label" for="creditor-description">Description</label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <textarea matInput id="creditor-description" formControlName="description" rows="4"></textarea>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" [disabled]="loading()" (click)="cancel()">
    Cancel
  </button>
  <button mat-flat-button color="primary" type="button" [disabled]="loading()" (click)="submit()">
    @if (loading()) {
      <mat-spinner diameter="18"></mat-spinner>
    } @else {
      {{ btnTitle() }}
    }
  </button>
</mat-dialog-actions>
