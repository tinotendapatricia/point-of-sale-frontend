<clr-modal [(clrModalOpen)]="opened" [clrModalClosable]="false">
  <h3 class="modal-title">{{ title }}</h3>
  <div class="modal-body">
    <form [formGroup]="creditorForm">
      <clr-input-container>
        <label class="required">Account</label>
        <input clrInput type="text" formControlName="account" required />
        <clr-control-error>Account is required!</clr-control-error>
      </clr-input-container>
      <clr-input-container>
        <label class="required">Name</label>
        <input clrInput type="text" formControlName="name" required />
        <clr-control-error>Name is required!</clr-control-error>
      </clr-input-container>

      <clr-textarea-container>
        <label>Address</label>
        <textarea
          clrTextarea
          formControlName="address"
          rows="4"
          cols="70"
        ></textarea>
      </clr-textarea-container>
      <clr-textarea-container>
        <label>Description </label>
        <textarea
          clrTextarea
          formControlName="description"
          rows="4"
          cols="70"
        ></textarea>
      </clr-textarea-container>
    </form>
  </div>
  <div class="modal-footer">
    <button
      type="button"
      class="btn btn-outline"
      (click)="closeModal.emit(false)"
    >
      Cancel
    </button>
    <button
      type="button"
      class="btn btn-success"
      [clrLoading]="btnState"
      (click)="formValue.emit(creditorForm.value)"
    >
      Submit
    </button>
  </div>
</clr-modal>
