<form class="creditor-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="field">
    <label class="field-label" for="creditor-account">Account<span class="required-marker">*</span></label>
    <mat-form-field class="full-width" subscriptSizing="dynamic">
      <input id="creditor-account" matInput type="text" formControlName="account" />
      @if (form.controls.account.hasError('required')) {
        <mat-error>Account is required</mat-error>
      }
    </mat-form-field>
  </div>

  <div class="field">
    <label class="field-label" for="creditor-name">Name<span class="required-marker">*</span></label>
    <mat-form-field class="full-width" subscriptSizing="dynamic">
      <input id="creditor-name" matInput type="text" formControlName="name" />
      @if (form.controls.name.hasError('required')) {
        <mat-error>Name is required</mat-error>
      }
    </mat-form-field>
  </div>

  <div class="field">
    <label class="field-label" for="creditor-address">Address</label>
    <mat-form-field class="full-width" subscriptSizing="dynamic">
      <textarea id="creditor-address" matInput rows="4" formControlName="address"></textarea>
    </mat-form-field>
  </div>

  <div class="field">
    <label class="field-label" for="creditor-description">Description</label>
    <mat-form-field class="full-width" subscriptSizing="dynamic">
      <textarea id="creditor-description" matInput rows="4" formControlName="description"></textarea>
    </mat-form-field>
  </div>

  <div class="mt-4 flex justify-end gap-2">
    <button type="button" mat-stroked-button [disabled]="loading()" (click)="cancelled.emit()">Cancel</button>
    <button type="submit" mat-flat-button [disabled]="loading()">
      @if (loading()) {
        <mat-spinner diameter="18" />
      } @else {
        {{ submitLabel() }}
      }
    </button>
  </div>
</form>
