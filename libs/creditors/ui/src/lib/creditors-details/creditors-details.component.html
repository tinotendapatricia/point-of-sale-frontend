@if (creditor(); as creditor) {
  <dl class="grid grid-cols-2 gap-2">
    <dt class="font-semibold">Account</dt>
    <dd>{{ creditor.account }}</dd>
    <dt class="font-semibold">Name</dt>
    <dd>{{ creditor.name }}</dd>
    <dt class="font-semibold">Contact</dt>
    <dd>{{ creditor.contact || '--' }}</dd>
    <dt class="font-semibold">Address</dt>
    <dd>{{ creditor.address || '--' }}</dd>
  </dl>
} @else {
  <p class="text-gray-600">No creditor selected</p>
}
