<div class="limit-height">
  <clr-datagrid
    [clrDgLoading]="loading"
    (clrDgRefresh)="updatedState.emit($event)"
    class="datagrid-compact"
    >
    <clr-dg-column [clrDgField]="'name'">Account</clr-dg-column>
    <clr-dg-column [clrDgField]="'createdBy'">Name</clr-dg-column>
    <clr-dg-column [clrDgField]="'createdBy'">Address</clr-dg-column>

    <clr-dg-column></clr-dg-column>

    <clr-dg-placeholder>{{ placeholderMessage }}</clr-dg-placeholder>

    @for (creditor of creditorsList; track creditor) {
      <clr-dg-row>
        <clr-dg-cell>{{ creditor?.account }}</clr-dg-cell>
        <clr-dg-cell>{{ creditor?.name }}</clr-dg-cell>
        <clr-dg-cell>{{ creditor?.address }}</clr-dg-cell>
        <clr-dg-cell><cds-icon shape="pencil" solid style="color: green;cursor: pointer;" (click)="updateSelected.emit(creditor)"></cds-icon></clr-dg-cell>
      </clr-dg-row>
    }

    @if (total > 0) {
      <clr-dg-footer>
        {{ pagination.firstItem + 1 }} - {{ pagination.lastItem + 1 }} of
        {{ pagination.totalItems }} Creditors
        <clr-dg-pagination
          #pagination
          [clrDgTotalItems]="total"
        ></clr-dg-pagination>
      </clr-dg-footer>
    }
  </clr-datagrid>
</div>
