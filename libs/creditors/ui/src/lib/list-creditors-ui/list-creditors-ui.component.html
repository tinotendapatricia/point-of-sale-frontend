<ng-template #actionsTpl let-row>
  <button type="button" mat-icon-button [attr.aria-label]="`Edit ${row.name}`" (click)="edited.emit(row)">
    <mat-icon class="text-green-600">edit</mat-icon>
  </button>
</ng-template>

<pos-frontend-table
  caption="Creditors"
  [action]="true"
  [columns]="columns()"
  [data]="dataSource()"
  [loading]="loading()"
  [paginated]="true"
  [total]="total()"
  (actioned)="added.emit()"
  (page)="page.emit($event)"
>
  <header class="flex flex-wrap items-center justify-between gap-4 px-4 py-2">
    <div>
      <h1 class="text-2xl font-bold">Creditors</h1>
      <p class="text-sm text-gray-600">Manage creditors</p>
    </div>
    <div class="flex gap-2">
      <button type="button" mat-stroked-button [disabled]="loading()" (click)="refreshed.emit()">
        <mat-icon>sync</mat-icon>
        Refresh
      </button>
      <button type="button" mat-flat-button (click)="added.emit()">
        <mat-icon>add_circle</mat-icon>
        Add New
      </button>
    </div>
  </header>
</pos-frontend-table>
