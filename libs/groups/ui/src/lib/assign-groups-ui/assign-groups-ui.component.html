<div class="card-header">
  <span style="font-weight: 900">Assign or Remove Authorities</span>
</div>
<div class="roles-row">
  <mat-checkbox [checked]="isAllSelected()" (change)="pushAllRoles()">
    <strong>Assign All</strong>
  </mat-checkbox>
</div>
<div class="roles-grid">
  @for (role of roles; track role) {
    <div class="roles-grid-item">
      <mat-checkbox [checked]="isChecked(role.id)" (change)="pushToCheckedRoles(role.id)">
        {{ role.name.split('_').join(' ') | titlecase }}
      </mat-checkbox>
    </div>
  }
</div>
<div class="card-header"></div>
<br />
<button mat-stroked-button type="button" [routerLink]="['/groups']">Cancel</button>
<button mat-flat-button color="primary" type="button" [disabled]="loading" (click)="onSave()">
  @if (loading) {
    <mat-spinner diameter="18"></mat-spinner>
  } @else {
    Save
  }
</button>
