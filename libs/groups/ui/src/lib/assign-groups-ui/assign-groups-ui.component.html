<div class="card-header">
  <span class="font-black">Assign or Remove Authorities</span>
</div>
<div class="roles-row">
  <mat-checkbox [checked]="allSelected()" (change)="selectAllRoles()">
    <strong>Assign All</strong>
  </mat-checkbox>
</div>
<div class="roles-grid">
  @for (role of roles(); track role.id) {
    <div class="roles-grid-item">
      <mat-checkbox [checked]="isChecked(role.id)" (change)="toggleRole(role.id)">
        {{ roleLabel(role) | titlecase }}
      </mat-checkbox>
    </div>
  }
</div>
<div class="mt-6 flex gap-2">
  <button type="button" mat-stroked-button (click)="cancelled.emit()">Cancel</button>
  <button type="button" mat-flat-button [disabled]="loading()" (click)="save()">
    @if (loading()) {
      <mat-spinner diameter="18" />
    } @else {
      Save
    }
  </button>
</div>
