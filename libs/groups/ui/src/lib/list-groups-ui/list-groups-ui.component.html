<ng-template #permissionsTpl let-group>
  <button type="button" mat-button (click)="permissionsViewed.emit(group.id)">View Group Permissions</button>
</ng-template>

<ng-template #actionsTpl let-group>
  <button type="button" mat-icon-button aria-label="Update group" (click)="permissionsViewed.emit(group.id)">
    <mat-icon class="text-green-600">edit</mat-icon>
  </button>
</ng-template>

<pos-frontend-table
  caption="Groups"
  [action]="true"
  [columns]="columns()"
  [data]="dataSource()"
  [loading]="loading()"
  [paginated]="true"
  [total]="total()"
  (actioned)="actioned.emit()"
  (page)="page.emit($event)"
>
  <ng-container ngProjectAs="header">
    <ng-content select="header" />
  </ng-container>
</pos-frontend-table>
