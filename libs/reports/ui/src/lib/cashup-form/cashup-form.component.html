<div class="card">
  <div class="card-header">Daily Cashup</div>
  <div class="card-block">
    <button (click)="togglePrintAngGenerate()">Print Previous Cashup</button>
    @if (!printCashup) {
      <div>
        <clr-select-container>
          <label>Select Till Station</label>
          <select clrSelect [(ngModel)]="station">
            <option>Select Station</option>
            @for (till of tills; track till) {
              <option [value]="till.station+'/'+till.tDate">
                Station {{ till.station }} for {{ till.tDate }}
              </option>
            }
          </select>
        </clr-select-container>
        <br />
        <div class="clr-row">
          @for (currency of n; track currency; let x = $index) {
            <div class="clr-col-md-4">
              <div class="text-center">
                <strong>{{ currency.code }}</strong>
              </div>
              <table class="table table-vertical">
                <tbody>
                  <tr>
                    <th>Type</th>
                    <th>Amount at Hand</th>
                  </tr>
                  @for (deno of currency.denominations; track deno; let y = $index) {
                    <tr>
                      <th>{{ deno.type }}</th>
                      <td>
                        <input type="number" name="amount" [(ngModel)]="deno.value" />
                      </td>
                    </tr>
                  }
                  <tr>
                    <th>Total</th>
                    <td>
                      {{ calculateTotal(currency.denominations) }}
                    </td>
                  </tr>
                </tbody>
              </table>
              <a class="reset">Reset</a>
            </div>
          }
        </div>
        <button class="btn btn-success" (click)="submit()">
          Generate Cashup Report
        </button>
      </div>
    }

    @if (printCashup) {
      <div>
        <br />
        <div class="clr-row">
          <div class="clr-col-md-6">
            <input type="text" />
          </div>
          <div class="clr-col-md-6">
            <input type="date" />
          </div>
        </div>
        <button class="btn btn-success" (click)="submit()">
          Generate Cashup Report
        </button>
      </div>
    }
  </div>
</div>
