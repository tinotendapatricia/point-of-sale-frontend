<div class="limit-height">
  <clr-datagrid
    [clrDgLoading]="loading"
    (clrDgRefresh)="updatedState.emit($event)"
    class="datagrid-compact"
    >
    <clr-dg-column [clrDgField]="'name'">Name</clr-dg-column>
    <clr-dg-column [clrDgField]="'createdBy'">Created By</clr-dg-column>

    <clr-dg-column></clr-dg-column>

    <clr-dg-placeholder>{{ placeholderMessage }}</clr-dg-placeholder>

    @for (category of categoriesList; track category) {
      <clr-dg-row>
        <clr-dg-action-overflow>
          <button
            class="action-item"
            (click)="updateCategory.emit(category?.id)"
            >
            Update
          </button>
        </clr-dg-action-overflow>
        <clr-dg-cell>{{ category?.name }}</clr-dg-cell>
        <clr-dg-cell>{{ category?.createdBy }}</clr-dg-cell>
      </clr-dg-row>
    }

    @if (total > 0) {
      <clr-dg-footer>
        {{ pagination.firstItem + 1 }} - {{ pagination.lastItem + 1 }} of
        {{ pagination.totalItems }} Categorys
        <clr-dg-pagination
          #pagination
          [clrDgTotalItems]="total"
        ></clr-dg-pagination>
      </clr-dg-footer>
    }
  </clr-datagrid>
</div>
