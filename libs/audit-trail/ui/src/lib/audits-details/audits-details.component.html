


<table class="table table-vertical">
  <tbody>
    @for (field of audit.resource | keyvalue; track field) {
      <tr>
        @if (!isHide($safeNavigationMigration(field?.key))) {
          <th>{{ decamelize(field.key) | titlecase }}</th>
          <td>
            {{ field?.value }}
            @if ($safeNavigationMigration(field?.value) === null || $safeNavigationMigration(field?.value) === undefined) {
              <span
                >--</span
                >
              }
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
