


    <table class="table table-vertical">
      <tbody>
        <tr *ngFor="let field of audit.resource | keyvalue">
          <ng-container *ngIf="!isHide(field?.key)">
            <th>{{ decamelize(field.key) | titlecase }}</th>
            <td>
              {{ field?.value }}
              <span *ngIf="field?.value === null || field?.value === undefined"
                >--</span
              >
            </td>
          </ng-container>
        </tr>
      </tbody>
    </table>
