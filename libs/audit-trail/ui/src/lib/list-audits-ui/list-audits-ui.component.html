<div class="limit-height">
    <clr-datagrid
      [clrDgLoading]="loading"
      (clrDgRefresh)="updatedState.emit($event)"
      class="datagrid-compact"
    >
      <clr-dg-column [clrDgField]="'name'">Action</clr-dg-column>
      <clr-dg-column [clrDgField]="'actionedBy'">Actioned By</clr-dg-column>
      <clr-dg-column >Date Created</clr-dg-column>
  
      <clr-dg-column></clr-dg-column>
  
      <clr-dg-placeholder>{{ placeholderMessage }}</clr-dg-placeholder>
  
      <clr-dg-row *ngFor="let audit of auditsList"[clrDgItem]=audit >
        <clr-dg-action-overflow>
          <button class="action-item">Update</button>
        </clr-dg-action-overflow>
        <clr-dg-cell>{{ audit?.name }}</clr-dg-cell>
        <clr-dg-cell>{{ audit?.actionedBy }}</clr-dg-cell>
        <clr-dg-cell>{{ audit?.createdAt}}</clr-dg-cell>
        <clr-dg-cell></clr-dg-cell>
      </clr-dg-row>

      <clr-dg-detail *clrIfDetail="let detail">
        <clr-dg-detail-header>{{ detail.name }}</clr-dg-detail-header>
        <clr-dg-detail-body>
          <pos-frontend-audits-details [audit]="detail"></pos-frontend-audits-details>
        </clr-dg-detail-body>
      </clr-dg-detail>
  
      <clr-dg-footer *ngIf="total > 0">
        {{ pagination.firstItem + 1 }} - {{ pagination.lastItem + 1 }} of
        {{ pagination.totalItems }} Audits
        <clr-dg-pagination
          #pagination
          [clrDgTotalItems]="total"
        ></clr-dg-pagination>
      </clr-dg-footer>
    </clr-datagrid>
  </div>
