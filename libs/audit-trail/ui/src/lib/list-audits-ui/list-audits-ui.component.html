<ng-template #createdTpl let-row>{{ row.createdAt | date: 'medium' }}</ng-template>

<ng-template #actionsTpl let-row>
  <button
    type="button"
    mat-icon-button
    aria-label="View details"
    (click)="viewed.emit(row)"
  >
    <mat-icon class="text-green-600">visibility</mat-icon>
  </button>
</ng-template>

<div
  class="bg-white px-6 mx-6 mt-4 border border-gray-200 rounded-lg shadow-sm"
>
  <pos-frontend-table
    caption="Audits"
    [columns]="columns()"
    [data]="dataSource()"
    [loading]="loading()"
    [paginated]="true"
    [total]="total()"
    (page)="page.emit($event)"
  >
    <header class="flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold">Audit Trail</h1>
        <span class="text-sm text-gray-500">
          Track who did what, and when
        </span>
      </div>
      <div class="flex gap-2">
        <button type="button" mat-stroked-button [disabled]="loading()" (click)="refreshed.emit()">Refresh</button>
      </div>
    </header>
  </pos-frontend-table>
</div>
