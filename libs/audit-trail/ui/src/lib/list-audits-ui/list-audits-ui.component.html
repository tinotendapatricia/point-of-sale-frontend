<div class="table-wrap">
  <table mat-table [dataSource]="auditsList" multiTemplateDataRows>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let audit">{{ audit?.name }}</td>
    </ng-container>

    <ng-container matColumnDef="actionedBy">
      <th mat-header-cell *matHeaderCellDef>Actioned By</th>
      <td mat-cell *matCellDef="let audit">{{ audit?.actionedBy }}</td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef>Date Created</th>
      <td mat-cell *matCellDef="let audit">{{ audit?.createdAt }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let audit">
        <button mat-icon-button (click)="toggleDetail(audit)" aria-label="View details">
          <mat-icon>{{ expandedAudit === audit ? 'expand_less' : 'expand_more' }}</mat-icon>
        </button>
      </td>
    </ng-container>

    <ng-container matColumnDef="detail">
      <td mat-cell *matCellDef="let audit" [attr.colspan]="displayedColumns.length">
        @if (expandedAudit === audit) {
          <pos-frontend-audits-details [audit]="audit"></pos-frontend-audits-details>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: ['detail']"
      class="detail-row"
      [class.detail-row--expanded]="expandedAudit === row"
    ></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="displayedColumns.length">
        {{ loading ? 'Loading…' : placeholderMessage || 'No records found' }}
      </td>
    </tr>
  </table>
</div>

@if (total > 0) {
  <mat-paginator
    [length]="total"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPage($event)"
  ></mat-paginator>
}
