<ng-template #createdTpl let-row>{{ row.createdAt | date: 'medium' }}</ng-template>

<ng-template #actionsTpl let-row>
  <button type="button" mat-icon-button aria-label="View details" (click)="viewed.emit(row)">
    <mat-icon>visibility</mat-icon>
  </button>
</ng-template>

<pos-frontend-table
  caption="Audits"
  [columns]="columns()"
  [data]="dataSource()"
  [loading]="loading()"
  [paginated]="true"
  [total]="total()"
  (page)="page.emit($event)"
>
  <header class="flex flex-wrap items-center justify-between gap-4 px-4 py-2">
    <div>
      <h1 class="text-2xl font-bold">Audit Trail</h1>
      <p class="text-sm text-gray-600">Who did what, and when</p>
    </div>
    <button type="button" mat-stroked-button (click)="refreshed.emit()">
      <mat-icon>sync</mat-icon>
      Refresh
    </button>
  </header>
</pos-frontend-table>
