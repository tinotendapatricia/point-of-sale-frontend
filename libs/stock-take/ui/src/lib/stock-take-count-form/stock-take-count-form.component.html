<form class="flex flex-wrap items-end gap-4" [formGroup]="form" (ngSubmit)="startComparison()">
  <div class="field">
    <label class="field-label" for="stock-count-batch">Batch Number<span class="required-marker">*</span></label>
    <mat-form-field class="full-width" subscriptSizing="dynamic">
      <input id="stock-count-batch" matInput type="number" formControlName="batchNumber" />
      @if (form.controls.batchNumber.hasError('required')) {
        <mat-error>Batch number is required</mat-error>
      }
    </mat-form-field>
  </div>
  <div class="field">
    <button type="submit" mat-flat-button [disabled]="loading()">Start Stock Take Comparison</button>
  </div>
</form>

@if (hasComparison()) {
  <pos-frontend-table caption="Products" type="default" [columns]="columns" [data]="dataSource()" />
  <button type="button" class="mt-4" mat-flat-button (click)="adjustStock()">Adjust Stock</button>
}
