<div class="field">
  <label class="field-label">Batch Number</label>
  <mat-form-field class="full-width" subscriptSizing="dynamic">
    <input matInput type="number" [(ngModel)]="batchNumber" />
  </mat-form-field>
</div>
<button mat-flat-button color="primary" type="button" (click)="startComparison()">Start Stock Take Comparison</button>

@if (newArray.length>0) {
  <table class="table">
    <thead>
      <th>Product Id</th>
      <th>Product Name</th>
      <th>Batch Count</th>
      <th>System Count</th>
      <th>Variance</th>
      <th></th>
    </thead>
    <tbody>
      @for (product of newArray; track product) {
        <tr>
          <td>{{ product.productId }}</td>
          <td>{{ product.name }}</td>
          <td>{{ product.batchCount }}</td>
          <td>{{ product.systemCount }}</td>
          <td>{{ product.variance }}</td>
          <td></td>
        </tr>
      }
    </tbody>
  </table>
}

@if (newArray.length!>0) {
  <button class="btn btn-primary" (click)="adjustStock()">Adjust Stock</button>
}
