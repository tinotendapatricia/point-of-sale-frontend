

<div class="clr-row">
  <div class="clr-col-md-4">
    <form [formGroup]="form">
      <div class="clr-row">
        <div class="clr-col-md-9">
          <label>Select Product</label>
          <ng-select formControlName="code">
            @for (product of products; track product) {
              <ng-option
                [value]="product.code"
                >{{ product.name }}</ng-option
                >
              }
            </ng-select>
          </div>
          <div class="clr-col-md-3">
            <div class="field">
              <label class="field-label">Quantity</label>
              <mat-form-field class="full-width" subscriptSizing="dynamic">
                <input matInput type="number" formControlName="quantity" />
              </mat-form-field>
            </div>
          </div>
        </div>
        <div class="text-center">
          <button class="btn btn-sm" (click)="addProduct()"

          >{{buttonMessage}}</button>
          <hr>
          </div>
        </form>
      </div>
      <div class="clr-col-md-8">
        <span class="err">{{errorMessage}}</span>
        <table class="table" style="font-size: 10px;">
          <thead>
            <th></th>
            <th>Product</th>
            <th>Product Description</th>
            <th>Quantity</th>
            <th></th>
          </thead>
          <tbody>
            @for (p of selectedProducts; track p; let i = $index) {
              <tr>
                <td style="width: 10px;">{{i+1}}</td>
                <td>{{ p.code }}</td>
                <td>{{ p.productName }}</td>
                <td>{{ p.quantity }}</td>
                <td>
                  <button mat-icon-button (click)="deleteProduct(p.code)" aria-label="Delete product">
                    <mat-icon style="color: red">delete</mat-icon>
                  </button>
                  <button mat-icon-button (click)="updateProduct(i,p)" aria-label="Edit product">
                    <mat-icon style="color: green">edit</mat-icon>
                  </button>
                </td>
              </tr>
            }
          </tbody>
        </table>
        <br>
          <button class="btn btn-primary btn-block" (click)="onSubmit()" [disabled]="selectedProducts.length<=0">Close Batch</button>




        </div>
      </div>
