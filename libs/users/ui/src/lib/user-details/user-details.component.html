<dl class="details-list">
  @for (field of user() | keyvalue; track field.key) {
    @if (!isHidden(field.key)) {
      <div class="details-row">
        <dt>{{ decamelize(field.key) | titlecase }}</dt>
        <dd>
          @if (field.value === null || field.value === undefined) {
            --
          } @else {
            {{ field.value }}
          }
        </dd>
      </div>
    }
  }
</dl>
