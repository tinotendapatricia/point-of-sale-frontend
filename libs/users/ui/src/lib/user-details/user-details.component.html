@for (field of user | keyvalue; track field) {
  @if (!isHide(field?.key)) {
    <div class="clr-row">
      <div class="clr-col-6">
        <span class="clr-control-label">{{
          decamelize(field?.key) | titlecase
        }}</span>
      </div>
      <div class="clr-col">
        <span>{{ field?.value }}</span>
        @if (field?.value === null || field?.value === undefined) {
          <span
            >--</span
            >
          }
        </div>
      </div>
    }
  }
