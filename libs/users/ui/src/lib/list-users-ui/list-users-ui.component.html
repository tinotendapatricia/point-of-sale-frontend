<ng-template #statusTpl let-user>
  <mat-chip [class.st-ok]="user.active" [class.st-alert]="!user.active">
    {{ user.active ? 'Active' : 'Inactive' }}
  </mat-chip>
</ng-template>

<ng-template #actionsTpl let-user>
  <button type="button" mat-icon-button aria-label="Edit user" (click)="edited.emit(user)">
    <mat-icon class="text-green-600">edit</mat-icon>
  </button>
  <button type="button" mat-icon-button aria-label="More actions" [matMenuTriggerFor]="menu">
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <button type="button" mat-menu-item (click)="viewed.emit(user)">View details</button>
    <button type="button" mat-menu-item (click)="authoritiesViewed.emit(user)">Manage permissions</button>
    <button type="button" mat-menu-item (click)="statusChanged.emit(user)">
      {{ user.active ? 'Deactivate' : 'Activate' }}
    </button>
  </mat-menu>
</ng-template>

<pos-frontend-table
  caption="Users"
  [action]="true"
  [columns]="columns()"
  [data]="dataSource()"
  [loading]="loading()"
  [paginated]="true"
  [total]="total()"
  (actioned)="actioned.emit()"
  (page)="page.emit($event)"
>
  <ng-container ngProjectAs="header">
    <ng-content select="header" />
  </ng-container>
</pos-frontend-table>
