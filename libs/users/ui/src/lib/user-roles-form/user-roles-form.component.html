<div class="card-header">
  <span class="header-title">Assign or Remove Authorities</span>
</div>

<mat-checkbox [checked]="allSelected()" (change)="toggleAllRoles()">
  <strong>Assign All</strong>
</mat-checkbox>

<div class="roles-grid">
  @for (role of roles(); track role.id) {
    <mat-checkbox [checked]="isChecked(role.id)" (change)="toggleRole(role.id)">
      {{ roleLabel(role) | titlecase }}
    </mat-checkbox>
  }
</div>

<button type="button" mat-flat-button [disabled]="loading()" (click)="save()">
  @if (loading()) {
    <mat-spinner diameter="18" />
  } @else {
    Save
  }
</button>
