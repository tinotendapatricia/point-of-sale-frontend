<pos-frontend-stock-take-count-form
  (formValue)="initiateStockTake($event)"
  [batchProducts]="batchProducts"
  [products]="(productsFacade.allProducts$ | async)!"
  (adjustedStock)="adjustStock($event)"

></pos-frontend-stock-take-count-form>

@if (isAdjustStock) {
  <pos-frontend-stock-adjustment
    (closeModal)="isAdjustStock=false"
    [stockToBeAdjusted]="selectedAdjustedStock"
  ></pos-frontend-stock-adjustment>
}
