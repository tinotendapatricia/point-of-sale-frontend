<div class="p-4">
  @if (batchNumber(); as batch) {
    <div class="batch">Batch Number: {{ batch }}</div>
    <pos-frontend-stock-take-form class="mt-4 block" [products]="products()" (submitted)="closeBatch($event)" />
  } @else {
    <button type="button" mat-flat-button [disabled]="creating()" (click)="initiateBatch()">
      @if (creating()) {
        <mat-spinner diameter="18" />
      } @else {
        Initiate Stock Take
      }
    </button>
  }
</div>
