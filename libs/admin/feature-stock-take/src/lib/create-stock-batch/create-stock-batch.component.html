
<div class="card">
  <div class="card-block">
    @if (batchNumber) {
      <div class="batch">Batch Number: {{batchNumber}}</div>
    }
    @if (!batchNumber) {
      <button class="btn btn-primary" (click)="initiateBatch()">Initiate Stock Take</button>
    }
    <br>
      @if (batchNumber) {
        <pos-frontend-stock-take-form
          [products]="(productsFacade.allProducts$|async)!"
          (formValue)="isAddProductsToStockBatch($event)"
        ></pos-frontend-stock-take-form>
      }
    </div>
  </div>

  @if (isCloseBatch) {
    <pos-frontend-close-batch
      [batchNumber]="batchNumber!"
      [batch]="selectedBatch"
      (closeModal)="close()"
    ></pos-frontend-close-batch>
  }
