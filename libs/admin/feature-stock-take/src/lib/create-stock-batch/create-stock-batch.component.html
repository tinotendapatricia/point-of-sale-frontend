
<div class="card">
    <div class="card-block">
        <div class="batch" *ngIf="batchNumber">Batch Number: {{batchNumber}}</div>
        <button class="btn btn-primary" *ngIf="!batchNumber" (click)="initiateBatch()">Initiate Stock Take</button>
        <br>
        <pos-frontend-stock-take-form *ngIf="batchNumber"
        [products]="(productsFacade.allProducts$|async)!"
        (formValue)="isAddProductsToStockBatch($event)"
        
        ></pos-frontend-stock-take-form>
    </div>
</div>

<pos-frontend-close-batch
*ngIf="isCloseBatch"
[batchNumber]="batchNumber!"
[batch]="selectedBatch"
(closeModal)="close()"

></pos-frontend-close-batch>
