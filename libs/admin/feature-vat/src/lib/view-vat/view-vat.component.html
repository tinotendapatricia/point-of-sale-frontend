<mat-card class="login">
  <mat-card-content>
    &nbsp;<button class="act" (click)="isUpdate = true">
      <cds-icon shape="plus-circle" solid style="color: green"></cds-icon>Add
      New</button
    >&nbsp;&nbsp;|&nbsp;&nbsp;<button class="act" (click)="getVat()">
      <cds-icon shape="sync" solid style="color: rgb(73, 7, 226)"></cds-icon
      >Refresh
    </button>
    <div class="card-header"></div>
    <br />
    <pos-frontend-vat-details
      [vat]="(vatFacade.selectedVat$ | async)!"
    ></pos-frontend-vat-details>
  </mat-card-content>
</mat-card>

<pos-frontend-update-vat
  *ngIf="isUpdate"
  (closeModal)="getVat()"
></pos-frontend-update-vat>
