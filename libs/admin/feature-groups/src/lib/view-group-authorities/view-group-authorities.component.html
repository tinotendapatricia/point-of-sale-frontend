<mat-card>
  <mat-card-content>
    <h1 class="mb-4 text-2xl font-bold">Permissions for {{ group()?.name }}</h1>
    <pos-frontend-assign-groups-ui
      [groupRoles]="groupRoles()"
      [loading]="submitting()"
      [roles]="roles()"
      (cancelled)="back()"
      (saved)="save($event)"
    />
  </mat-card-content>
</mat-card>
