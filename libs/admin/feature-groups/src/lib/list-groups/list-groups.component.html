<pos-frontend-list-groups-ui
  [groups]="groups()"
  [loading]="loading()"
  [total]="total()"
  (actioned)="createGroup()"
  (page)="onPage($event)"
  (permissionsViewed)="viewGroupAuthorities($event)"
>
  <header class="flex flex-wrap items-center justify-between gap-4 px-4 py-2">
    <div>
      <h1 class="text-2xl font-bold">Groups</h1>
      <p class="text-sm text-gray-600">Manage user groups and their permissions</p>
    </div>
    <div class="flex gap-2">
      <button type="button" mat-stroked-button (click)="refresh()">
        <mat-icon>sync</mat-icon>
        Refresh
      </button>
      <button type="button" mat-flat-button (click)="createGroup()">
        <mat-icon>add_circle</mat-icon>
        Add New
      </button>
    </div>
  </header>
</pos-frontend-list-groups-ui>
