<mat-card class="login">
  <mat-card-content>
    &nbsp;<button class="act" (click)="isCreate = true">
      <cds-icon shape="plus-circle" solid style="color: green"></cds-icon>Add
      New</button
    >&nbsp;&nbsp;|&nbsp;&nbsp;<button class="act" (click)="getDebtorList({})">
      <cds-icon shape="sync" solid style="color: rgb(73, 7, 226)"></cds-icon
      >Refresh
    </button>

    <pos-frontend-debtors-list-ui
      [debtorsList]="(debtorsFacade.allDebtors$ | async)!"
      [total]="(debtorsFacade.totalDebtors$ | async)!"
      [loading]="(debtorsFacade.loading$ | async)!"
      [placeholderMessage]="'Debtors'"
      (updatedState)="getDebtorList($event)"
      (updateSelected)="updateDebtor($event)"
    ></pos-frontend-debtors-list-ui>
  </mat-card-content>
</mat-card>

<pos-frontend-create-debtors
  *ngIf="isCreate"
  (closeModal)="refresh()"
></pos-frontend-create-debtors>

<pos-frontend-update-debtors
  *ngIf="isUpdate"
  [debtor]="selectedDebtor"
  (closeModal)="refresh()"
></pos-frontend-update-debtors>
