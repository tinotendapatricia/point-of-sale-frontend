<mat-card>
  <mat-card-content>
    <h1 class="mb-4 text-2xl font-bold">Update Station</h1>
    @if (stationStore.getOneLoading()) {
      <p class="text-gray-600">Loading…</p>
    } @else {
      <pos-frontend-stations-form
        submitLabel="Save"
        [loading]="submitting()"
        [station]="stationStore.station()"
        (cancelled)="cancel()"
        (submitted)="update($event)"
      />
    }
  </mat-card-content>
</mat-card>
