<pos-frontend-dialog-header [title]="title" [subtitle]="station?.name" [hideClose]="loading()" />

<form class="dialog-form" [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <div class="field">
      <label class="field-label" for="station-account">Account<span class="required-marker">*</span></label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <input id="station-account" matInput type="text" formControlName="account" />
        @if (form.controls.account.hasError('required')) {
          <mat-error>Account is required</mat-error>
        }
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label" for="station-name">Name<span class="required-marker">*</span></label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <input id="station-name" matInput type="text" formControlName="name" />
        @if (form.controls.name.hasError('required')) {
          <mat-error>Name is required</mat-error>
        }
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label" for="station-address">Address</label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <textarea id="station-address" matInput rows="3" formControlName="address"></textarea>
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label" for="station-contact">Contact Details</label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <textarea id="station-contact" matInput rows="3" formControlName="contact"></textarea>
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" mat-stroked-button mat-dialog-close [disabled]="loading()">Cancel</button>
    <button type="submit" mat-flat-button [disabled]="loading()">
      @if (loading()) {
        <mat-spinner diameter="18" />
      } @else {
        {{ submitLabel }}
      }
    </button>
  </mat-dialog-actions>
</form>
