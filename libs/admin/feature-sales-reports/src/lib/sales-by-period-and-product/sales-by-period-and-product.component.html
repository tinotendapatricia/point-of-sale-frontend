<div class="card">
  <div class="card-header">Sales by Product</div>
  <div class="card-block">
    <pos-frontend-reports-form
      (getPdf)="getPdf($event)"
      (getExcel)="getExcel($event)"
      [loading]="loading"
      [isDate]="true"
      [isProduct]="true"
      [isExcel]="true"
      [products]="(productsFacade.allProducts$ | async)!"
    ></pos-frontend-reports-form>
  </div>
</div>
