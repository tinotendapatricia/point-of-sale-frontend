
<br />
<div class="h">Company Details</div>
<hr />
<br />
<mat-card class="login">
  <mat-card-content>
    &nbsp;@if (!company) {
    <button class="act" (click)="create()"
      >
      <mat-icon style="color: green">add_circle</mat-icon>Add
      New</button
      >
      }&nbsp;&nbsp;|&nbsp;&nbsp;@if (company) {
      <button class="act" (click)="update()"
        >
        <mat-icon style="color: green">edit</mat-icon>Update
        </button
        >
        }&nbsp;&nbsp;|&nbsp;&nbsp;<button class="act" (click)="getCompany()">
        <mat-icon style="color: rgb(73, 7, 226)">sync</mat-icon
          >Refresh
        </button>
        <br><br>
        <pos-frontend-company-details-ui
          [company]="company"
        ></pos-frontend-company-details-ui>
      </mat-card-content>
    </mat-card>
