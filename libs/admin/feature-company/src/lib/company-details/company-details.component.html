
<br />
<div class="h">Company Details</div>
<hr />
<br />
<!-- <button class="btn btn-sm" (click)="createDebtor()">Add</button>
<button class="btn btn-sm" (click)="getDebtorList({})">Refresh</button> -->
<mat-card class="login" >
  <mat-card-content>
    &nbsp;@if (!company) {
    <button class="act" (click)="isCreate = true"
      >
      <cds-icon shape="plus-circle" solid style="color: green"></cds-icon>Add
      New</button
      >
      }&nbsp;&nbsp;|&nbsp;&nbsp;@if (company) {
      <button class="act" (click)="isUpdate = true"
        >
        <cds-icon shape="plus-circle" solid style="color: green"></cds-icon>Update
        </button
        >
        }&nbsp;&nbsp;|&nbsp;&nbsp;<button class="act" (click)="getCompany()">
        <cds-icon shape="sync" solid style="color: rgb(73, 7, 226)"></cds-icon
          >Refresh
        </button>
        <br><br>
        <pos-frontend-company-details-ui
          [company]="company"
        ></pos-frontend-company-details-ui>
      </mat-card-content>
    </mat-card>

    @if (isCreate) {
      <pos-frontend-create-company-details
        (closeModal)="refresh()"
        >
      </pos-frontend-create-company-details>
    }

    @if (isUpdate) {
      <pos-frontend-update-company-details
        [company]="company"
        (closeModal)="refresh()"
        >
      </pos-frontend-update-company-details>
    }
