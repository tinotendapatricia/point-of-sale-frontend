<mat-card class="login" >
  <mat-card-content>
    &nbsp;<button class="act" (click)="isCreate = true"
    *ngIf="!company"
    >
      <cds-icon shape="plus-circle" solid style="color: green"></cds-icon>Add
      New</button
    >&nbsp;&nbsp;|&nbsp;&nbsp;<button class="act" (click)="isUpdate = true"
    *ngIf="company"
    >
      <cds-icon shape="plus-circle" solid style="color: green"></cds-icon>Update
      </button
    >&nbsp;&nbsp;|&nbsp;&nbsp;<button class="act" (click)="getCompany()">
      <cds-icon shape="sync" solid style="color: rgb(73, 7, 226)"></cds-icon
      >Refresh
    </button>
<br><br>
    <pos-frontend-company-details-ui
    [company]="company"
    ></pos-frontend-company-details-ui>
  </mat-card-content>
</mat-card>

<pos-frontend-create-company-details
*ngIf="isCreate"
(closeModal)="refresh()"
>

</pos-frontend-create-company-details>

<pos-frontend-update-company-details
*ngIf="isUpdate"
[company]="company"
(closeModal)="refresh()"
>
</pos-frontend-update-company-details>
