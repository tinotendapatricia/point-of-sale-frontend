<mat-card>
  <mat-card-content>
    <header class="mb-4 flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold">Company Details</h1>
        <p class="text-sm text-gray-600">The company this installation is licensed to</p>
      </div>
      <div class="flex gap-2">
        <button type="button" mat-stroked-button [disabled]="loading()" (click)="refresh()">
          <mat-icon>sync</mat-icon>
          Refresh
        </button>
        @if (company()) {
          <button type="button" mat-flat-button (click)="update()">
            <mat-icon>edit</mat-icon>
            Update
          </button>
        } @else {
          <button type="button" mat-flat-button (click)="create()">
            <mat-icon>add_circle</mat-icon>
            Add New
          </button>
        }
      </div>
    </header>

    @if (loading()) {
      <p class="text-gray-600">Loading…</p>
    } @else {
      <pos-frontend-company-details-ui [company]="company()" />
    }
  </mat-card-content>
</mat-card>
