<header class="pos-topbar bg-[#EEF6FF]">
  <a class="pos-topbar-brand" [routerLink]="['/dashboard']">
    <img src="/assets/logo.png" alt="OctoPOS" />
  </a>

  <div class="pos-topbar-actions">
    @if (defaultCurrency(); as currency) {
      <span class="pos-topbar-currency">{{ currency.code }}</span>
    }

    <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Account menu">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <a mat-menu-item [routerLink]="['/users/my-account']">My Account</a>
      <button mat-menu-item type="button" (click)="authFacade.logout()">Log out</button>
    </mat-menu>
  </div>
</header>
