<header class="pos-topbar bg-[#EEF6FF]">
  <a class="pos-topbar-brand" [routerLink]="['/dashboard']">
    <img ngSrc="/assets/logo.png" alt="OctoPOS" width="98" height="28" priority />
  </a>

  <div class="pos-topbar-actions">
    @if (currencyStore.defaultCurrency(); as currency) {
      <span class="pos-topbar-currency">{{ currency.code }}</span>
    }

    <button type="button" mat-icon-button aria-label="Account menu" [matMenuTriggerFor]="userMenu">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <a mat-menu-item [routerLink]="['/users/my-account']">My Account</a>
      <button type="button" mat-menu-item (click)="logout()">Log out</button>
    </mat-menu>
  </div>
</header>
