<h2 class="mb-2 text-base font-semibold">Recent Transactions</h2>
<table class="w-full text-sm">
  <thead>
    <tr>
      <th class="text-left">Invoice Number</th>
      <th class="text-left">Amount</th>
      <th class="text-left">Debtor</th>
    </tr>
  </thead>
  <tbody>
    @for (sale of recentTransactions(); track sale.invoiceNumber) {
      <tr>
        <td>{{ sale.invoiceNumber }}</td>
        <td>{{ sale.totalAmount | currency }}</td>
        <td>{{ sale.debtorAccount }}-{{ sale.debtorName }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="3">{{ loading() ? 'Loading…' : 'No recent transactions' }}</td>
      </tr>
    }
  </tbody>
</table>
