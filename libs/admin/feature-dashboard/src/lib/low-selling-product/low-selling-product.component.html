<h2 class="mb-2 text-base font-semibold">Low Selling Products</h2>
<ul class="text-sm">
  @for (product of lowSelling(); track product.name) {
    <li class="flex justify-between">
      <span>{{ product.name }}</span>
      <span>{{ product.quantitySold }}</span>
    </li>
  } @empty {
    <li>{{ loading() ? 'Loading…' : 'No products' }}</li>
  }
</ul>
