<ng-template #rateTpl let-row>
  {{ row.rate | currency }}
</ng-template>

<ng-template #defaultTpl let-row>
  @if (row.isDefault) {
    <mat-icon class="text-green-600">check</mat-icon>
  } @else {
    <mat-icon class="text-red-700">close</mat-icon>
  }
</ng-template>

<ng-template #actionsTpl let-row>
  <button type="button" mat-icon-button aria-label="Edit currency" (click)="edit(row.id)">
    <mat-icon class="text-green-600">edit</mat-icon>
  </button>
  <button type="button" mat-icon-button aria-label="More actions" [matMenuTriggerFor]="menu">
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <button type="button" mat-menu-item (click)="makeDefault(row)">Make Default Currency</button>
    <button type="button" mat-menu-item (click)="updateRate(row)">Update Rate</button>
  </mat-menu>
</ng-template>

<pos-frontend-table
  caption="Currencies"
  [action]="true"
  [columns]="columns()"
  [data]="dataSource()"
  [loading]="loading()"
  [paginated]="true"
  [total]="total()"
  (actioned)="add()"
  (page)="onPage($event)"
>
  <header class="flex flex-wrap items-center justify-between gap-4 px-4 py-2">
    <div>
      <h1 class="text-2xl font-bold">Currencies</h1>
      <p class="text-sm text-gray-600">Manage system currencies and exchange rates</p>
    </div>
    <button type="button" mat-flat-button (click)="add()">
      <mat-icon class="text-green-600">add_circle</mat-icon>
      Add New
    </button>
  </header>
</pos-frontend-table>
