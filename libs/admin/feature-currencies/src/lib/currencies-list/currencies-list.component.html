<button class="btn btn-sm" (click)="getCurrencyList({})">Refresh</button> -->
<mat-card class="login">
  <mat-card-content>
    &nbsp;<button class="act" (click)="isCreate = true">
      <cds-icon shape="plus-circle" solid style="color: green"></cds-icon>Add
      New</button
    >&nbsp;&nbsp;|&nbsp;&nbsp;<button class="act" (click)="getCurrencyList({})">
      <cds-icon shape="sync" solid style="color: rgb(73, 7, 226)"></cds-icon
      >Refresh
    </button>

    <pos-frontend-currencies-list-ui
      [currenciesList]="(currenciesFacade.allCurrencies$ | async)!"
      [total]="(currenciesFacade.totalCurrencies$ | async)!"
      [loading]="(currenciesFacade.loading$ | async)!"
      [placeholderMessage]="'Currencies'"
      (updatedState)="getCurrencyList($event)"
      (updateSelected)="updateCurrency($event)"
      (viewCurrencyPermissions)="viewCurrencyAuthorities($event)"
      (makeDefault)="makeDefaultCurrency($event)"
      (updateRate)="updateRate($event)"
    ></pos-frontend-currencies-list-ui>
  </mat-card-content>
</mat-card>

<pos-frontend-make-default
  *ngIf="isMakeDefault"
  [currency]="selectedCurrency"
  (closeModal)="refresh()"
></pos-frontend-make-default>

<pos-frontend-create-currency
  *ngIf="isCreate"
  (closeModal)="refresh()"
></pos-frontend-create-currency>

<pos-frontend-update-rate
  *ngIf="isUpdateRate"
  [currency]="selectedCurrency"
  (closeModal)="refresh()"
></pos-frontend-update-rate>

<pos-frontend-update-currency
  *ngIf="isUpdate"
  [currency]="selectedCurrency"
  (closeModal)="refresh()"
></pos-frontend-update-currency>
