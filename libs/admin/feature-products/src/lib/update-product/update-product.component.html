<mat-card class="update-product-card">
  <mat-card-content>
    <h1 class="mb-4 text-2xl font-bold">Update Product</h1>
    @if (productStore.getOneLoading()) {
      <p class="text-gray-600">Loading...</p>
    } @else {
      <pos-frontend-products-form
        submitLabel="Save"
        [loading]="submitting()"
        [product]="productStore.product()"
        (cancelled)="cancel()"
        (submitted)="update($event)"
      />
    }
  </mat-card-content>
</mat-card>
