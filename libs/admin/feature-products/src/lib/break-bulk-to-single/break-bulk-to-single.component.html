<mat-card class="break-bulk-card">
  <mat-card-content>
    <header class="mb-4 flex flex-wrap items-center justify-between gap-4">
      <h1 class="text-2xl font-bold">Break Bulk</h1>
      <div class="flex gap-2">
        <a mat-stroked-button routerLink="/products/new">
          <mat-icon class="text-green-600">add_circle</mat-icon>
          Add New
        </a>
        <button type="button" mat-stroked-button (click)="refresh()">
          <mat-icon class="text-indigo-700">sync</mat-icon>
          Refresh
        </button>
      </div>
    </header>

    <pos-frontend-break-bulk-form
      [loading]="submitting()"
      [products]="productStore.products()"
      (cancelled)="cancel()"
      (submitted)="breakBulk($event)"
    />
  </mat-card-content>
</mat-card>
