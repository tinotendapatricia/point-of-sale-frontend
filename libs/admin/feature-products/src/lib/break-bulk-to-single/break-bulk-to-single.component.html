
<br />
<div class="h">Products</div>
<hr />
<br />
<mat-card class="login">
  <mat-card-content>
    &nbsp;<button
      class="act"
      [routerLink]="['/products/new']"
      routerLinkActive="router-link-active"
    >
      <mat-icon style="color: green">add_circle</mat-icon>Add
      New</button
    >&nbsp;&nbsp;|&nbsp;&nbsp;<button class="act" (click)="getProductList()">
      <mat-icon style="color: rgb(73, 7, 226)">sync</mat-icon
      >Refresh
    </button>
<br><br>
    <pos-frontend-break-bulk-form
      [products]="productsStore.products()"
      [loading]="submitting()"
      (formValue)="onSubmit($event)"
    ></pos-frontend-break-bulk-form>
  </mat-card-content>
</mat-card>
