<ng-template #costTpl let-row>
  {{ row.cost?.[0]?.value | currency }}
</ng-template>

<ng-template #priceTpl let-row>
  {{ row.price?.[0]?.value | currency }}
</ng-template>

<ng-template #activeTpl let-row>
  @if (row.active) {
    <mat-icon style="color: green">check</mat-icon>
  } @else {
    <mat-icon style="color: firebrick">close</mat-icon>
  }
</ng-template>

<ng-template #actionsTpl let-row>
  <button mat-icon-button (click)="updateProduct(row.id)" aria-label="Edit product">
    <mat-icon style="color: green">edit</mat-icon>
  </button>
  <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="More actions">
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <button mat-menu-item (click)="updateCost(row)">Update Cost</button>
    <button mat-menu-item (click)="updatePrice(row)">Update Price</button>
  </mat-menu>
</ng-template>

<pos-frontend-table
  [data]="dataSource()"
  [columns]="columns()"
  [loading]="loading()"
  [total]="total()"
  [paginated]="true"
  [caption]="'Products'"
  [action]="true"
  (page)="getProductList($event)"
  (actioned)="addProduct()"
>
  <header class="flex flex-wrap items-center justify-between gap-4 px-4 py-2">
    <div>
      <h1 class="text-2xl font-bold">Products</h1>
      <p class="text-gray-600 text-sm">Manage your product inventory</p>
    </div>
    <button mat-flat-button type="button" (click)="addProduct()">
      <mat-icon style="color: green">add_circle</mat-icon> Add New
    </button>
  </header>
</pos-frontend-table>
