<ng-template #costTpl let-row>
  {{ row.cost?.[0]?.value | currency }}
</ng-template>

<ng-template #priceTpl let-row>
  {{ row.price?.[0]?.value | currency }}
</ng-template>

<ng-template #activeTpl let-row>
  <span [posFrontendBadge]="row.active ? 'success' : 'error'">{{ row.active ? 'Active' : 'Inactive' }}</span>
</ng-template>

<ng-template #actionsTpl let-row>
  <button type="button" mat-icon-button aria-label="Edit product" (click)="edit(row.id)">
    <mat-icon class="text-green-600">edit</mat-icon>
  </button>
  <button type="button" mat-icon-button aria-label="More actions" [matMenuTriggerFor]="menu">
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <button type="button" mat-menu-item (click)="updateCost(row)">Update Cost</button>
    <button type="button" mat-menu-item (click)="updatePrice(row)">Update Price</button>
  </mat-menu>
</ng-template>

<pos-frontend-table
  caption="Products"
  [action]="true"
  [columns]="columns()"
  [data]="dataSource()"
  [loading]="loading()"
  [paginated]="true"
  [total]="total()"
  (actioned)="add()"
  (page)="onPage($event)"
>
  <header class="flex flex-wrap items-center justify-between gap-4 px-4 py-2">
    <div>
      <h1 class="text-2xl font-bold">Products</h1>
      <p class="text-sm text-gray-600">Manage your product inventory</p>
    </div>
    <button type="button" mat-flat-button (click)="add()">
      <mat-icon class="text-green-600">add_circle</mat-icon>
      Add New
    </button>
  </header>
</pos-frontend-table>
