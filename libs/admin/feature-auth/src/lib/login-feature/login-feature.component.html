<pos-frontend-login-form
  [title]="'Admin Login'"
  [loading]="submitting()"
  (formValue)="onSubmit($event)"
  (license)="license()"
></pos-frontend-login-form>

@if (calDateDifference(expiryDate()) >= 1 && calDateDifference(expiryDate()) <= 8) {
  <p class="text-center" style="color: red; font-weight: 900">
    Your license will expire on {{ expiryDate() }}, days remaining {{ calDateDifference(expiryDate()) }} day(s). Please
    renew.
  </p>
}
@if (calDateDifference(expiryDate()) <= 0) {
  <p class="text-center" style="color: red; font-weight: 900; font-size:20px">
    LICENSE EXPIRED.PLEASE RENEW
  </p>
}

<div class="floating-btn" (click)="license()">
  <mat-icon style="color: purple">vpn_key</mat-icon>
</div>
