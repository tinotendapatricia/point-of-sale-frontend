<pos-frontend-login-form
  title="Admin Login"
  [loading]="submitting()"
  (formValue)="login($event)"
  (license)="license()"
/>

@if (expiringSoon()) {
  <p class="license-warning text-center">
    Your license will expire on {{ expiryDate() }}, days remaining {{ daysRemaining() }} day(s). Please renew.
  </p>
}
@if (expired()) {
  <p class="license-warning license-expired text-center">LICENSE EXPIRED.PLEASE RENEW</p>
}

<button type="button" class="floating-btn" mat-icon-button aria-label="Apply license" (click)="license()">
  <mat-icon class="license-icon">vpn_key</mat-icon>
</button>
