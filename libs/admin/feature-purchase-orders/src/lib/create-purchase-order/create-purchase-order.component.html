<h1 class="my-4 text-2xl font-bold">Purchase Order</h1>

<mat-card>
  <mat-card-content>
    <pos-frontend-purchase-order-form
      [creditors]="creditors()"
      [loading]="submitting()"
      [products]="products()"
      [purchaseOrderNumber]="purchaseOrderNumber()"
      (submitted)="create($event)"
    />
  </mat-card-content>
</mat-card>
