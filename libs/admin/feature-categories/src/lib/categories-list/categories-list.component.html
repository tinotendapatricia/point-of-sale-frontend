<!-- <button class="btn btn-sm" (click)="createCategorie()">Add</button>
<button class="btn btn-sm" (click)="getCategorieList({})">Refresh</button> -->
<mat-card class="login">
  <mat-card-content>
    &nbsp;<button class="act" (click)="isCreate = true">
      <cds-icon shape="plus-circle" solid style="color: green"></cds-icon>Add
      New</button
    >&nbsp;&nbsp;|&nbsp;&nbsp;<button class="act" (click)="getCategorieList({})">
      <cds-icon
        shape="minus-circle"
        solid
        style="color: rgb(190, 14, 38)"
      ></cds-icon
      >Refresh
    </button>

    <pos-frontend-category-list-ui
      [categoriesList]="(categoriesFacade.allCategories$ | async)!"
      [total]="(categoriesFacade.totalCategories$ | async)!"
      [loading]="(categoriesFacade.loading$ | async)!"
      [placeholderMessage]="'Categories'"
      (updatedState)="getCategorieList($event)"
      
    ></pos-frontend-category-list-ui>
  </mat-card-content>
</mat-card>
