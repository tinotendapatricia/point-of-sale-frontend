<mat-card>
  <mat-card-content>
    <h1 class="mb-4 text-2xl font-bold">Update Category</h1>
    @if (categoryStore.getOneLoading()) {
      <p class="text-gray-600">Loading...</p>
    } @else {
      <pos-frontend-category-form
        submitLabel="Save"
        [category]="categoryStore.category()"
        [loading]="submitting()"
        (cancelled)="cancel()"
        (submitted)="update($event)"
      />
    }
  </mat-card-content>
</mat-card>
