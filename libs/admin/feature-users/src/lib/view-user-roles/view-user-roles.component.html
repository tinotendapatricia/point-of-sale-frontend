<div class="pos-page-header">
  <h1>Permissions for {{ selectedUser()?.name }}</h1>
</div>

<mat-card class="login">
  <mat-card-content>
    <pos-frontend-user-roles-form
      [roles]="allRoles()"
      [userRoles]="selectedUser()?.roles"
      [userId]="selectedUser()?.id"
      (save)="onSubmit($event)"
    ></pos-frontend-user-roles-form>
  </mat-card-content>
</mat-card>
