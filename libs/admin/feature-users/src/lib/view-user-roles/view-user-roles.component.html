<mat-card>
  <mat-card-content>
    <h1 class="mb-4 text-2xl font-bold">Permissions for {{ user()?.name }}</h1>
    <pos-frontend-user-roles-form
      [loading]="submitting()"
      [roles]="roles()"
      [userRoles]="userRoles()"
      (saved)="save($event)"
    />
  </mat-card-content>
</mat-card>
