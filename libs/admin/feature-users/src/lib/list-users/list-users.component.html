<div
  class="bg-white px-6 mx-6 mt-4 border border-gray-200 rounded-lg shadow-sm"
>
  <pos-frontend-list-users-ui
    [loading]="loading()"
    [total]="total()"
    [users]="users()"
    (actioned)="createUser()"
    (authoritiesViewed)="viewUserAuthorities($event)"
    (edited)="updateUser($event)"
    (page)="onPage($event)"
    (statusChanged)="changeUserStatus($event)"
    (viewed)="viewUser($event)"
  >
    <header class="flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold">Users</h1>
        <span class="text-sm text-gray-500">
          Manage users, their status and permissions
        </span>
      </div>
      <div class="flex gap-2">
        <button type="button" mat-stroked-button [disabled]="loading()" (click)="refresh()">Refresh</button>
        <button type="button" mat-flat-button (click)="createUser()">Add New</button>
      </div>
    </header>
  </pos-frontend-list-users-ui>
</div>
