<div class="pos-page-header">
  <h1>Users</h1>
</div>

<mat-card class="login">
  <mat-card-content>
    <button mat-stroked-button color="primary" (click)="createUser()">
      <mat-icon>add_circle</mat-icon>
      Add New
    </button>
    <button mat-stroked-button (click)="getUserList({})">
      <mat-icon>sync</mat-icon>
      Refresh
    </button>

    <pos-frontend-list-users-ui
      [userList]="allUsers()"
      [total]="totalUsers()"
      [loading]="loading()"
      [placeholderMessage]="'Users'"
      (updatedState)="getUserList($event)"
      (updateSelected)="updateUser($event)"
      (changeSelectedUserStatus)="changeUserStatus($event)"
      (viewUserAuthorities)="viewUserAuthorities($event)"
    ></pos-frontend-list-users-ui>
  </mat-card-content>
</mat-card>
