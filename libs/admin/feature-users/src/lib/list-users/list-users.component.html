<pos-frontend-list-users-ui
  [loading]="loading()"
  [total]="total()"
  [users]="users()"
  (actioned)="createUser()"
  (authoritiesViewed)="viewUserAuthorities($event)"
  (edited)="updateUser($event)"
  (page)="onPage($event)"
  (statusChanged)="changeUserStatus($event)"
>
  <header class="flex flex-wrap items-center justify-between gap-4 px-4 py-2">
    <div>
      <h1 class="text-2xl font-bold">Users</h1>
      <p class="text-sm text-gray-600">Manage users and their permissions</p>
    </div>
    <div class="flex gap-2">
      <button type="button" mat-stroked-button (click)="refresh()">
        <mat-icon>sync</mat-icon>
        Refresh
      </button>
      <button type="button" mat-flat-button (click)="createUser()">
        <mat-icon>add_circle</mat-icon>
        Add New
      </button>
    </div>
  </header>
</pos-frontend-list-users-ui>
