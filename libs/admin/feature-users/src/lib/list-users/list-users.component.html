<!-- <button class="btn btn-sm" (click)="createUser()">Add</button>
<button class="btn btn-sm" (click)="getUserList({})">Refresh</button> -->
<mat-card class="login">
  <mat-card-content>
    &nbsp;<button class="act" (click)="isCreate = true">
      <cds-icon shape="plus-circle" solid style="color: green"></cds-icon>Add
      New</button
    >&nbsp;&nbsp;|&nbsp;&nbsp;<button class="act" (click)="getUserList({})">
      <cds-icon shape="sync" solid style="color: rgb(56, 12, 177)"></cds-icon
      >Refresh
    </button>

    <pos-frontend-list-users-ui
      [userList]="(usersFacade.allUsers$ | async)!"
      [total]="(usersFacade.totalUsers$ | async)!"
      [loading]="(usersFacade.loading$ | async)!"
      [placeholderMessage]="'Users'"
      (updatedState)="getUserList($event)"
      (updateSelected)="updateUser($event)"
      (changeSelectedUserStatus)="changeUserStatus($event)"
      (viewUserAuthorities)="viewUserAuthorities($event)"
    ></pos-frontend-list-users-ui>
  </mat-card-content>
</mat-card>

<pos-frontend-create-user
  *ngIf="isCreate"
  (closeModal)="refresh()"
></pos-frontend-create-user>

<pos-frontend-update-user
  *ngIf="isUpdate"
  [user]="selectedUser"
  (closeModal)="refresh()"
></pos-frontend-update-user>
