<div class="field">
  <label class="field-label" for="group-select">Group</label>
  <mat-form-field subscriptSizing="dynamic">
    <mat-select id="group-select" [value]="groupId()" (selectionChange)="onGroupChange($event)">
      @for (group of allGroups(); track group.id) {
        <mat-option [value]="group.id">{{ group.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>

<div>
  <button mat-stroked-button color="primary" (click)="createUser()">Add</button>
  <button mat-stroked-button (click)="getUserList({})">Refresh</button>

  @if (groupId()) {
    <pos-frontend-list-users-ui
      [userList]="allUsers()"
      [total]="totalUsers()"
      [loading]="loading()"
      [placeholderMessage]="'Users'"
      (updatedState)="getUserList($event)"
      (updateSelected)="updateUser($event)"
      (viewSelected)="viewUser($event)"
      (changeSelectedUserStatus)="changeUserStatus($event)"
      (viewUserAuthorities)="viewUserAuthorities($event)"
    ></pos-frontend-list-users-ui>
  }
</div>
