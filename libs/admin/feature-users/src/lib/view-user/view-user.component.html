<div
  class="bg-white p-6 mx-6 mt-4 border border-gray-200 rounded-lg shadow-sm"
>
  <header class="mb-4 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold">{{ user()?.name ?? 'User' }}</h1>
      <span class="text-sm text-gray-500">User details</span>
    </div>
    <div class="flex gap-2">
      <a mat-stroked-button routerLink="/users">Back</a>
      @if (user(); as current) {
        <a mat-flat-button [routerLink]="['/users/view-user-authorities', current.id]">Manage Permissions</a>
      }
    </div>
  </header>

  @if (loading()) {
    <p class="text-gray-600">Loading…</p>
  } @else {
    <pos-frontend-user-details [user]="user()" />
  }
</div>
