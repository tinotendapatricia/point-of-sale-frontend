<div class="mb-4 flex justify-end">
  <a mat-stroked-button routerLink="/users">
    <mat-icon>arrow_back</mat-icon>
    Go Back
  </a>
</div>

<mat-card>
  <mat-card-content>
    @if (loading()) {
      <p class="text-gray-600">Loading…</p>

      <pos-frontend-user-details [user]="user()" />
    }
  </mat-card-content>
</mat-card>
