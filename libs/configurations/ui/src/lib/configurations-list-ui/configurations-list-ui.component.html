<ng-template #createdTpl let-row>{{ row.createdAt | date: 'medium' }}</ng-template>

<ng-template #actionsTpl let-row>
  <button type="button" mat-icon-button aria-label="Update configuration" (click)="edited.emit(row)">
    <mat-icon class="text-green-600">edit</mat-icon>
  </button>
</ng-template>

<pos-frontend-table
  caption="Configurations"
  [action]="true"
  [columns]="columns()"
  [data]="dataSource()"
  [loading]="loading()"
  [paginated]="true"
  [tplPagination]="true"
  (actioned)="added.emit()"
>
  <header class="flex flex-wrap items-center justify-between gap-4 px-4 py-2">
    <div>
      <h1 class="text-2xl font-bold">Configurations</h1>
      <p class="text-sm text-gray-600">Manage till station and printer configurations</p>
    </div>
    <div class="flex gap-2">
      <button type="button" mat-stroked-button (click)="refreshed.emit()">
        <mat-icon>sync</mat-icon>
        Refresh
      </button>
      <button type="button" mat-flat-button (click)="added.emit()">
        <mat-icon>add_circle</mat-icon>
        Add New
      </button>
    </div>
  </header>
</pos-frontend-table>
