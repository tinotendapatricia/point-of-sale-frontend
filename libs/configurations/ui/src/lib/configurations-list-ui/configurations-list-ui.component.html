<ng-template #createdTpl let-row>{{ row.createdAt | date: 'medium' }}</ng-template>

<ng-template #actionsTpl let-row>
  <button
    type="button"
    mat-icon-button
    aria-label="Update configuration"
    (click)="edited.emit(row)"
  >
    <mat-icon class="text-green-600">edit</mat-icon>
  </button>
</ng-template>

<div
  class="bg-white px-6 mx-6 mt-4 border border-gray-200 rounded-lg shadow-sm"
>
  <pos-frontend-table
    caption="Configurations"
    [action]="true"
    [columns]="columns()"
    [data]="dataSource()"
    [loading]="loading()"
    [paginated]="true"
    [tplPagination]="true"
    (actioned)="added.emit()"
  >
    <header class="flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold">Configurations</h1>
        <span class="text-sm text-gray-500">
          Manage till station and printer configurations
        </span>
      </div>
      <div class="flex gap-2">
        <button type="button" mat-stroked-button [disabled]="loading()" (click)="refreshed.emit()">Refresh</button>
        <button type="button" mat-flat-button (click)="added.emit()">Add New</button>
      </div>
    </header>
  </pos-frontend-table>
</div>
