<h2 mat-dialog-title>{{ title() }}</h2>
<mat-dialog-content>
  <form [formGroup]="configurationForm" class="configuration-form">
    <div class="field-row">
      <div class="field">
        <label class="field-label" for="config-station-name">Station Name<span class="required-marker">*</span></label>
        <mat-form-field class="full-width" subscriptSizing="dynamic">
          <input matInput id="config-station-name" type="text" formControlName="stationName" required />
        </mat-form-field>
      </div>
      <div class="field">
        <label class="field-label" for="config-station-number">Station Number<span class="required-marker">*</span></label>
        <mat-form-field class="full-width" subscriptSizing="dynamic">
          <input matInput id="config-station-number" type="number" min="50" formControlName="stationNumber" required />
        </mat-form-field>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label class="field-label" for="config-printer-name">Printer Name<span class="required-marker">*</span></label>
        <mat-form-field class="full-width" subscriptSizing="dynamic">
          <input matInput id="config-printer-name" type="text" formControlName="printerName" required />
        </mat-form-field>
      </div>
      <div class="field">
        <label class="field-label" for="config-copies">Print Copies<span class="required-marker">*</span></label>
        <mat-form-field class="full-width" subscriptSizing="dynamic">
          <input matInput id="config-copies" type="number" formControlName="copies" required />
        </mat-form-field>
      </div>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" [disabled]="loading()" (click)="cancel()">
    Cancel
  </button>
  <button mat-flat-button color="primary" type="button" [disabled]="loading()" (click)="submit()">
    @if (loading()) {
      <mat-spinner diameter="18"></mat-spinner>
    } @else {
      {{ btnTitle() }}
    }
  </button>
</mat-dialog-actions>
