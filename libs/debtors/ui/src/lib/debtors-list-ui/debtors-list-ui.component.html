<div class="table-wrap">
  <table mat-table [dataSource]="debtorsList">
    <ng-container matColumnDef="account">
      <th mat-header-cell *matHeaderCellDef>Account</th>
      <td mat-cell *matCellDef="let debtor">{{ debtor?.account }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let debtor">{{ debtor?.name }}</td>
    </ng-container>

    <ng-container matColumnDef="discount">
      <th mat-header-cell *matHeaderCellDef>Discount</th>
      <td mat-cell *matCellDef="let debtor">
        {{ debtor?.discount }}
        @if (!debtor.discount) {
          <span>--</span>
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let debtor">
        <button mat-icon-button (click)="updateSelected.emit(debtor)" aria-label="Update debtor">
          <mat-icon style="color: green">edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="displayedColumns.length">
        {{ loading ? 'Loading…' : placeholderMessage || 'No records found' }}
      </td>
    </tr>
  </table>
</div>

@if (total > 0) {
  <mat-paginator
    [length]="total"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPage($event)"
  ></mat-paginator>
}
