<h2 mat-dialog-title>{{ title() }}</h2>
<mat-dialog-content>
  <form [formGroup]="debtorForm" class="debtor-form">
    <div class="field">
      <label class="field-label" for="debtor-name">Name<span class="required-marker">*</span></label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <input matInput id="debtor-name" type="text" formControlName="name" required />
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label" for="debtor-account">Account<span class="required-marker">*</span></label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <input matInput id="debtor-account" type="text" formControlName="account" required />
      </mat-form-field>
    </div>

    <div class="field-row">
      <div class="field">
        <label class="field-label">Currency</label>
        <mat-form-field class="full-width" subscriptSizing="dynamic">
          <mat-select formControlName="currency">
            @for (currency of currencies(); track currency) {
              <mat-option [value]="currency.id">{{ currency.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="field">
        <label class="field-label" for="debtor-discount">Discount(%)</label>
        <mat-form-field class="full-width" subscriptSizing="dynamic">
          <input matInput id="debtor-discount" type="text" formControlName="discount" />
        </mat-form-field>
      </div>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" [disabled]="loading()" (click)="cancel()">
    Cancel
  </button>
  <button mat-flat-button color="primary" type="button" [disabled]="loading()" (click)="submit()">
    @if (loading()) {
      <mat-spinner diameter="18"></mat-spinner>
    } @else {
      {{ btnTitle() }}
    }
  </button>
</mat-dialog-actions>
