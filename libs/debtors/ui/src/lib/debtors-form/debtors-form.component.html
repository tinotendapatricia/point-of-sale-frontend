<clr-modal [(clrModalOpen)]="opened" [clrModalClosable]="false">
  <div class="modal-title">{{ title }}</div>>
  <div class="modal-body">
    <form [formGroup]="debtorForm">
      <clr-input-container>
        <label>Name</label>
        <input clrInput type="text" formControlName="name" required />
        <clr-control-error>Name is required!</clr-control-error>
      </clr-input-container>
      <clr-input-container>
        <label>Account</label>
        <input clrInput type="text" formControlName="account" required />
        <clr-control-error>Account is required!</clr-control-error>
      </clr-input-container>
      <div class="clr-row">
        <div class="clr-col-md-6">
          <clr-select-container>
            <label>Currency</label>
            <select clrSelect formControlName="currency">
              <option>Select Currency</option>
              <option [value]="currency.id" *ngFor="let currency of currencies">
                {{ currency.name }}
              </option>
            </select>
            <clr-control-error>Group is required!</clr-control-error>
          </clr-select-container>
        </div>
        <div class="clr-col-md-6">
          <clr-input-container>
            <label>Discount(%)</label>
            <input clrInput type="text" formControlName="discount" />
          </clr-input-container>
        </div>
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button
      type="button"
      class="btn btn-outline"
      (click)="closeModal.emit(false)"
    >
      Cancel
    </button>
    <button
      type="button"
      class="btn btn-success"
      [clrLoading]="btnState"
      (click)="formValue.emit(debtorForm.value)"
    >
      Submit
    </button>
  </div>
</clr-modal>
