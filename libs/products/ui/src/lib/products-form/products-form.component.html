<form [formGroup]="productForm" class="product-form">
  <div class="field">
    <label class="field-label" for="product-name">Name<span class="required-marker">*</span></label>
    <mat-form-field class="full-width" subscriptSizing="dynamic">
      <input matInput id="product-name" type="text" formControlName="name" required />
    </mat-form-field>
  </div>

  <div class="field">
    <label class="field-label" for="product-code">Code<span class="required-marker">*</span></label>
    <mat-form-field class="full-width" subscriptSizing="dynamic">
      <input matInput id="product-code" type="text" formControlName="code" required />
    </mat-form-field>
  </div>

  <div class="field">
    <label class="field-label" for="product-barcode">Barcode Code<span class="required-marker">*</span></label>
    <mat-form-field class="full-width" subscriptSizing="dynamic">
      <input matInput id="product-barcode" type="text" formControlName="barcode" required />
    </mat-form-field>
  </div>

  <div class="field">
    <label class="field-label">Active<span class="required-marker">*</span></label>
    <mat-radio-group formControlName="active">
      <mat-radio-button [value]="true">Yes</mat-radio-button>
      <mat-radio-button [value]="false">No</mat-radio-button>
    </mat-radio-group>
  </div>
</form>
<div class="card-header"></div>
<br />
<button mat-stroked-button type="button" (click)="closeModal.emit(false)">
  Cancel
</button>
<button
  mat-flat-button
  color="primary"
  type="button"
  [disabled]="!productForm.valid || loading"
  (click)="formValue.emit(productForm.value)"
>
  @if (loading) {
    <mat-spinner diameter="18"></mat-spinner>
  } @else {
    Submit
  }
</button>
