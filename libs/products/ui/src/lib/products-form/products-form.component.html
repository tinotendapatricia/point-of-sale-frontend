<form [formGroup]="productForm">
  <clr-input-container>
    <label class="required">Name</label>
    <input clrInput type="text" formControlName="name" required />
    <clr-control-error>Name is required!</clr-control-error>
  </clr-input-container>
  <clr-input-container>
    <label class="required">Code</label>
    <input clrInput type="text" formControlName="code" required />
    <clr-control-error>Code is required!</clr-control-error>
  </clr-input-container>

  <clr-input-container>
    <label class="required">Barcode Code</label>
    <input clrInput type="text" formControlName="barcode" required />
    <clr-control-error>Barcode is required!</clr-control-error>
  </clr-input-container>

  <div class="clr-row">
    
    <div class="clr-col-md-6">
      <clr-radio-container clrInline>
        <label class="required">Active</label>
        <clr-radio-wrapper>
          <input
            type="radio"
            clrRadio
            name="active"
            required
            [value]="true"
            formControlName="active"
          />
          <label>Yes</label>
        </clr-radio-wrapper>
        <clr-radio-wrapper>
          <input
            type="radio"
            clrRadio
            name="active"
            required
            [value]="false"
            formControlName="active"
          />
          <label>No</label>
        </clr-radio-wrapper>
      </clr-radio-container>
    </div>
  </div>
</form>
<div class="card-header"></div>
<br />
<button type="button" class="btn btn-outline" (click)="closeModal.emit(false)">
  Cancel
</button>
<button
  type="button"
  class="btn btn-success"
  [clrLoading]="btnState"
  [disabled]="!productForm.valid"
  (click)="formValue.emit(productForm.value)"
>
  Submit
</button>
