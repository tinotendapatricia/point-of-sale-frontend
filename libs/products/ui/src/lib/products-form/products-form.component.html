<form class="product-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="field">
    <label class="field-label" for="product-name">Name<span class="required-marker">*</span></label>
    <mat-form-field class="full-width" subscriptSizing="dynamic">
      <input id="product-name" matInput type="text" formControlName="name" />
      @if (form.controls.name.hasError('required')) {
        <mat-error>Name is required</mat-error>
      }
    </mat-form-field>
  </div>

  <div class="field">
    <label class="field-label" for="product-code">Code<span class="required-marker">*</span></label>
    <mat-form-field class="full-width" subscriptSizing="dynamic">
      <input id="product-code" matInput type="text" formControlName="code" />
      @if (form.controls.code.hasError('required')) {
        <mat-error>Code is required</mat-error>
      }
    </mat-form-field>
  </div>

  <div class="field">
    <label class="field-label" for="product-barcode">Barcode<span class="required-marker">*</span></label>
    <mat-form-field class="full-width" subscriptSizing="dynamic">
      <input id="product-barcode" matInput type="text" formControlName="barcode" />
      @if (form.controls.barcode.hasError('required')) {
        <mat-error>Barcode is required</mat-error>
      }
    </mat-form-field>
  </div>

  <div class="field">
    <span id="product-active-label" class="field-label">Active<span class="required-marker">*</span></span>
    <mat-radio-group class="flex gap-4" aria-labelledby="product-active-label" formControlName="active">
      <mat-radio-button [value]="true">Yes</mat-radio-button>
      <mat-radio-button [value]="false">No</mat-radio-button>
    </mat-radio-group>
  </div>

  <div class="mt-4 flex justify-end gap-2">
    <button type="button" mat-stroked-button [disabled]="loading()" (click)="cancelled.emit()">Cancel</button>
    <button type="submit" mat-flat-button [disabled]="loading()">
      @if (loading()) {
        <mat-spinner diameter="18" />
      } @else {
        {{ submitLabel() }}
      }
    </button>
  </div>
</form>
