<form class="cost-price-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="field">
    <label class="field-label" for="cost-price-amount">{{ amountLabel() }}<span class="required-marker">*</span></label>
    <mat-form-field class="full-width" subscriptSizing="dynamic">
      <input id="cost-price-amount" matInput type="number" min="0" formControlName="amount" />
      @if (form.controls.amount.hasError('required')) {
        <mat-error>{{ amountLabel() }} is required</mat-error>
      } @else if (form.controls.amount.hasError('min')) {
        <mat-error>{{ amountLabel() }} cannot be negative</mat-error>
      }
    </mat-form-field>
  </div>

  <div class="field">
    <label class="field-label" for="cost-price-date">Effective Date</label>
    <mat-form-field class="full-width" subscriptSizing="dynamic">
      <input id="cost-price-date" matInput type="date" formControlName="effectiveDate" />
    </mat-form-field>
  </div>

  <div class="mt-4 flex justify-end gap-2">
    <button type="button" mat-stroked-button [disabled]="loading()" (click)="cancelled.emit()">Cancel</button>
    <button type="submit" mat-flat-button [disabled]="loading()">
      @if (loading()) {
        <mat-spinner diameter="18" />
      } @else {
        {{ submitLabel() }}
      }
    </button>
  </div>
</form>
