<clr-modal [(clrModalOpen)]="opened" [clrModalClosable]="false">
    <h3 class="modal-title">{{ title }}&nbsp;&nbsp;{{product.name}}</h3>
    <div class="modal-body">
      <form [formGroup]="form">
        <clr-input-container *ngIf="isPrice">
          <label>Price</label>
          <input clrInput type="text" formControlName="price" required />
          <clr-control-error>Selling price is required!</clr-control-error>
        </clr-input-container>

        <clr-input-container *ngIf="isCost">
          <label>Cost</label>
          <input clrInput type="text" formControlName="cost" required />
          <clr-control-error>Cost of product is required!</clr-control-error>
        </clr-input-container>

        <div class="date">
          <label>Effective Date</label>
          <input type="date" formControlName="effectiveDate">
        </div>
        

      </form>
    </div>
    <div class="modal-footer">
      <button
        type="button"
        class="btn btn-outline"
        (click)="closeModal.emit(false)"
      >
        Cancel
      </button>
      <button
        type="button"
        class="btn btn-success"
        [clrLoading]="btnState"
        (click)="formValue.emit(form.value)"
      >
        Submit
      </button>
    </div>
  </clr-modal>
