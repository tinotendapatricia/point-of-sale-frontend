<form [formGroup]="form" class="break-bulk-form">
  <label>Parent Product</label>
  <ng-select formControlName="parentId">
    @for (product of products; track product) {
      <ng-option [value]="product.id"
        >{{ product.name }} {{ product.code }} {{ product.barcode }}
        @if (product.quantity < 1) {
          <span style="color: red">Out of stock</span>
        }
      </ng-option>
    }
  </ng-select>
  <br>
    <label>Child Product</label>
    <ng-select formControlName="childId">
      @for (product of products; track product) {
        <ng-option [value]="product.id"
          >{{ product.name }} {{ product.code }} {{ product.barcode }}
        </ng-option>
      }
    </ng-select>

    <div class="field">
      <label class="field-label" for="break-bulk-quantity">Quantity<span class="required-marker">*</span></label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <input matInput id="break-bulk-quantity" type="number" formControlName="quantity" required />
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label" for="break-bulk-parent-size">Parent Size<span class="required-marker">*</span></label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <input matInput id="break-bulk-parent-size" type="number" formControlName="parentSize" required />
      </mat-form-field>
    </div>
  </form>
  <br />
  <button mat-stroked-button type="button">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="loading"
    (click)="formValue.emit(form.value)"
  >
    @if (loading) {
      <mat-spinner diameter="18"></mat-spinner>
    } @else {
      Submit
    }
  </button>
