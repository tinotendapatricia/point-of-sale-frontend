<h2 mat-dialog-title>{{ title() }}</h2>
<mat-dialog-content>
  <form [formGroup]="currencyForm" class="currency-form">
    <div class="field">
      <label class="field-label" for="currency-name">Name<span class="required-marker">*</span></label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <input matInput id="currency-name" type="text" formControlName="name" required />
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label" for="currency-code">Code<span class="required-marker">*</span></label>
      <mat-form-field class="full-width" subscriptSizing="dynamic">
        <input matInput id="currency-code" type="text" formControlName="code" required />
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label">Active<span class="required-marker">*</span></label>
      <mat-radio-group formControlName="active">
        <mat-radio-button [value]="true">Yes</mat-radio-button>
        <mat-radio-button [value]="false">No</mat-radio-button>
      </mat-radio-group>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" [disabled]="loading()" (click)="cancel()">
    Cancel
  </button>
  <button mat-flat-button color="primary" type="button" [disabled]="loading()" (click)="submit()">
    @if (loading()) {
      <mat-spinner diameter="18"></mat-spinner>
    } @else {
      {{ btnTitle() }}
    }
  </button>
</mat-dialog-actions>
