<form class="rate-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="field">
    <label class="field-label" for="rate-value">Rate<span class="required-marker">*</span></label>
    <mat-form-field class="full-width" subscriptSizing="dynamic">
      <input id="rate-value" matInput type="number" min="0" formControlName="rate" />
      @if (form.controls.rate.hasError('required')) {
        <mat-error>Rate is required</mat-error>
      } @else if (form.controls.rate.hasError('min')) {
        <mat-error>Rate cannot be negative</mat-error>
      }
    </mat-form-field>
  </div>

  <div class="field">
    <label class="field-label" for="rate-effective-date">Effective Date</label>
    <mat-form-field class="full-width" subscriptSizing="dynamic">
      <input id="rate-effective-date" matInput type="date" formControlName="effectiveDate" />
    </mat-form-field>
  </div>

  <div class="mt-4 flex justify-end gap-2">
    <button type="button" mat-stroked-button [disabled]="loading()" (click)="cancelled.emit()">Cancel</button>
    <button type="submit" mat-flat-button [disabled]="loading()">
      @if (loading()) {
        <mat-spinner diameter="18" />
      } @else {
        {{ submitLabel() }}
      }
    </button>
  </div>
</form>
